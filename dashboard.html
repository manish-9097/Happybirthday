<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>License Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <header>
        <h1>License Dashboard</h1>
        <button id="logout">Logout</button>
    </header>

    <section class="cards">

        <div class="card">
            <h3>Total Keys</h3>
            <strong id="totalKeys">0</strong>
        </div>

        <div class="card">
            <h3>Active</h3>
            <strong id="activeKeys">0</strong>
        </div>

        <div class="card">
            <h3>Blocked</h3>
            <strong id="blockedKeys">0</strong>
        </div>

        <div class="card">
            <h3>Expired</h3>
            <strong id="expiredKeys">0</strong>
        </div>

    </section>


    <section class="generate">

        <h2>Generate License Key</h2>

        <select id="duration">
            <option value="1">1 Day</option>
            <option value="7">7 Days</option>
            <option value="30">30 Days</option>
            <option value="90">90 Days</option>
            <option value="365">1 Year</option>
        </select>

        <button id="generateBtn">
            Generate Key
        </button>

        <div id="generatedKey"></div>

    </section>


    <section>

        <h2>License Keys</h2>

        <table>

            <thead>
                <tr>
                    <th>Key</th>
                    <th>Status</th>
                    <th>Expiry</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="keysTable"></tbody>

        </table>

    </section>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
